version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    # Astro's validator currently supports TypeScript 5/6, not 7.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    open-pull-requests-limit: 5
    groups:
      routine-npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
